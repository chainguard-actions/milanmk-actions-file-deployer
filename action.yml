name: "FTP/SFTP file deployer"
description: "Fast and customizable deployment with parallel connections and proxy support. Deploy only changed files or do full sync."
branding:
  icon: "upload"
  color: "black"
inputs:
  remote-protocol:
    description: "Remote file transfer protocol (ftp, sftp)"
    required: true
    default: "sftp"
  remote-host:
    description: "Remote host"
    required: true
  remote-port:
    description: "Remote port"
    required: true
    default: 22
  remote-user:
    description: "FTP/SSH username"
    required: true
  remote-password:
    description: "FTP/SSH password"
    required: false
    default: ""
  ssh-private-key:
    description: "SSH private key of user"
    required: false
  proxy:
    description: "Enable proxy for FTP connection (true, false)"
    required: true
    default: false
  proxy-host:
    description: "Proxy host"
    required: false
  proxy-port:
    description: "Proxy port"
    required: false
    default: 22
  proxy-forwarding-port:
    description: "Proxy forwarding port"
    required: false
    default: 1080
  proxy-user:
    description: "Proxy username"
    required: false
  proxy-private-key:
    description: "Proxy SSH private key of user"
    required: false
  local-path:
    description: "Local path to repository"
    required: true
    default: .
  remote-path:
    description: "Remote path on host"
    required: true
    default: .
  sync:
    description: "File synchronization (delta, full)"
    required: true
    default: "delta"
  sync-delta-excludes:
    description: "Files to exclude from delta sync"
    required: false
  ssh-options:
    description: "Additional command arguments for SSH client"
    required: false
  ftp-options:
    description: "Additional command arguments for FTP client (lftp)"
    required: false
  ftp-mirror-options:
    description: "Additional command arguments for mirroring (lftp)"
    required: false
  ftp-post-sync-commands:
    description: "Additional ftp commands to run after synchronization (lftp)"
    required: false
  webhook:
    description: "Send webhook event notifications"
    required: false
  artifacts:
    description: "Upload logs to artifacts"
    required: false
  debug:
    description: "Enable debug information (true, false)"
    required: false
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: "Deploy"
      shell: bash
      env:
        INPUT_REMOTE_PROTOCOL: ${{ inputs.remote-protocol }}
        INPUT_REMOTE_HOST: ${{ inputs.remote-host }}
        INPUT_REMOTE_PORT: ${{ inputs.remote-port }}
        INPUT_REMOTE_USER: ${{ inputs.remote-user }}
        INPUT_REMOTE_PASSWORD: ${{ inputs.remote-password }}
        INPUT_SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        INPUT_PROXY: ${{ inputs.proxy }}
        INPUT_PROXY_HOST: ${{ inputs.proxy-host }}
        INPUT_PROXY_PORT: ${{ inputs.proxy-port }}
        INPUT_PROXY_FORWARDING_PORT: ${{ inputs.proxy-forwarding-port }}
        INPUT_PROXY_USER: ${{ inputs.proxy-user }}
        INPUT_PROXY_PRIVATE_KEY: ${{ inputs.proxy-private-key }}
        INPUT_LOCAL_PATH: ${{ inputs.local-path }}
        INPUT_REMOTE_PATH: ${{ inputs.remote-path }}
        INPUT_SYNC: ${{ inputs.sync }}
        INPUT_SYNC_DELTA_EXCLUDES: ${{ inputs.sync-delta-excludes }}
        INPUT_SSH_OPTIONS: ${{ inputs.ssh-options }}
        INPUT_FTP_OPTIONS: ${{ inputs.ftp-options }}
        INPUT_FTP_MIRROR_OPTIONS: ${{ inputs.ftp-mirror-options }}
        INPUT_FTP_POST_SYNC_COMMANDS: ${{ inputs.ftp-post-sync-commands }}
        INPUT_WEBHOOK: ${{ inputs.webhook }}
        INPUT_ARTIFACTS: ${{ inputs.artifacts }}
        INPUT_DEBUG: ${{ inputs.debug }}
        GITHUB_REPOSITORY_VAR: ${{ github.repository }}
        GITHUB_WORKFLOW_VAR: ${{ github.workflow }}
        GITHUB_JOB_VAR: ${{ github.job }}
        GITHUB_RUN_ID_VAR: ${{ github.run_id }}
        GITHUB_REF_VAR: ${{ github.ref }}
        GITHUB_EVENT_NAME_VAR: ${{ github.event_name }}
        GITHUB_ACTOR_VAR: ${{ github.actor }}
        GITHUB_SHA_VAR: ${{ github.sha }}
        GITHUB_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        GITHUB_EVENT_PATH_VAR: ${{ github.event_path }}
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GITHUB_EVENT_INPUTS_SYNC: ${{ github.event.inputs.sync }}
        GITHUB_ENV_JSON: ${{ toJSON(env) }}
        GITHUB_INPUTS_JSON: ${{ toJSON(inputs) }}
      run: |
        echo "::group::Initialization"

        function show_hr() {
          printf '%.s_' {1..100} && echo ""
        }

        function send_webhook() {
          local status="$1"
          # Validate that the webhook URL uses HTTPS to prevent exfiltration to arbitrary endpoints
          if [[ "$INPUT_WEBHOOK" != https://* ]]; then
            echo "::warning::Webhook URL must use HTTPS. Skipping webhook notification."
            return 1
          fi
          local post_data=$(jq --null-input \
          --arg timestamp "$(date +%s)" \
          --arg status "${status}" \
          --arg repository "$GITHUB_REPOSITORY_VAR" \
          --arg workflow "$GITHUB_WORKFLOW_VAR" \
          --arg job "$GITHUB_JOB_VAR" \
          --arg run_id "$GITHUB_RUN_ID_VAR" \
          --arg ref "$GITHUB_REF_VAR" \
          --arg event_name "$GITHUB_EVENT_NAME_VAR" \
          --arg actor "$GITHUB_ACTOR_VAR" \
          --arg message "$GITHUB_HEAD_COMMIT_MESSAGE" \
          --arg revision "$GITHUB_SHA_VAR" \
          '{"timestamp": $timestamp, "status": $status, "repository": $repository, "workflow": $workflow, "job": $job, "run_id": $run_id, "ref": $ref, "event_name": $event_name, "actor": $actor, "message": $message, "revision": $revision}')

          curl --data "${post_data}" --header "Content-Type: application/json" --max-time 30 --show-error --silent --user-agent "GitHub Workflow" "$INPUT_WEBHOOK"
        }

        [ "$INPUT_WEBHOOK" != "" ] && echo "Webhook notification (start): $(send_webhook "start")"

        echo "Check repository"

        if [ "$(git rev-parse --is-inside-work-tree 2>/dev/null)" != "true" ]; then
          echo "::error::Git repository not found. Please ensure you have a checkout step before this step."
          exit 1
        fi

        echo "Initialize inputs"

        local_path_unslash=$(echo "$INPUT_LOCAL_PATH" | sed 's:/*$::')
        local_path_slash="${local_path_unslash}/"

        remote_path_unslash=$(realpath --canonicalize-missing "$INPUT_REMOTE_PATH")
        remote_path_slash="${remote_path_unslash}/"

        input_remote_password="$INPUT_REMOTE_PASSWORD"
        if [ "$INPUT_REMOTE_PASSWORD" == "" ]; then
          input_remote_password="nopassword"
        fi

        input_proxy="$INPUT_PROXY"

        proxy_cmd=""
        if [ "${input_proxy}" == "true" ]; then
          proxy_cmd="proxychains"
        fi

        input_sync="$INPUT_SYNC"
        if [ "$GITHUB_EVENT_NAME_VAR" == "workflow_dispatch" ] && [ -n "$GITHUB_EVENT_INPUTS_SYNC" ]; then
          input_sync="$GITHUB_EVENT_INPUTS_SYNC"
        fi

        echo "Validate inputs"

        if [ "$INPUT_REMOTE_PROTOCOL" != "sftp" ] && [ "$INPUT_REMOTE_PROTOCOL" != "ftp" ]; then
          echo "::error::Invalid protocol: $INPUT_REMOTE_PROTOCOL. Valid protocols are 'ftp' and 'sftp'."
          exit 1
        fi

        if [ "${input_sync}" != "delta" ] && [ "${input_sync}" != "full" ]; then
          echo "::error::Invalid synchronization: ${input_sync}. Valid types are 'delta' and 'full'."
          exit 1
        fi

        echo "::endgroup::"



        if [ "$INPUT_DEBUG" == "true" ]; then
          echo "::group::Debug"

          echo "Context: github.event" && cat "$GITHUB_EVENT_PATH_VAR" && show_hr

          echo "Context: env" && echo "$GITHUB_ENV_JSON" && show_hr

          echo "Inputs:" && echo "$GITHUB_INPUTS_JSON"

          echo "::endgroup::"
        fi



        echo "::group::Install packages"

        apt_install=""
        apt_quiet="--quiet --quiet"
        if [ "$INPUT_DEBUG" == "true" ]; then
          apt_quiet=""
        fi

        sudo apt-get ${apt_quiet} update && sudo apt-get ${apt_quiet} --no-install-recommends --yes install lftp ${proxy_cmd}

        echo "::endgroup::"



        echo "::group::Configurations"

        config_ssh=~/.ssh/config
        mkdir ~/.ssh && echo -e "ExitOnForwardFailure=yes\nStrictHostKeyChecking=no" > ${config_ssh} && chmod 600 ${config_ssh} && echo "File created: ${config_ssh}"
        [ "$INPUT_DEBUG" == "true" ] && cat ${config_ssh}
        show_hr

        netrc=~/.netrc
        echo "machine $INPUT_REMOTE_HOST login $INPUT_REMOTE_USER password ${input_remote_password}" > ${netrc} && chmod 600 ${netrc} && echo "File created: ${netrc}"
        [ "$INPUT_DEBUG" == "true" ] && cat ${netrc}
        show_hr

        if [ "$INPUT_REMOTE_PROTOCOL" == "sftp" ] && [ "$INPUT_SSH_PRIVATE_KEY" != "" ]; then
          key_ssh=~/ssh_private_key
          printf '%s\n' "$INPUT_SSH_PRIVATE_KEY" > ${key_ssh} && chmod 600 ${key_ssh} && echo "File created: ${key_ssh}" && show_hr
        fi

        if [ "${input_proxy}" == "true" ]; then
          if [ "$INPUT_PROXY_PRIVATE_KEY" != "" ]; then
            key_proxy=~/proxy_private_key
            printf '%s\n' "$INPUT_PROXY_PRIVATE_KEY" > ${key_proxy} && chmod 600 ${key_proxy} && echo "File created: ${key_proxy}" && show_hr

            config_proxychains=~/.proxychains/proxychains.conf
            mkdir ~/.proxychains && printf 'strict_chain\nquiet_mode\ntcp_read_time_out 15000\ntcp_connect_time_out 10000\n[ProxyList]\nsocks5 127.0.0.1 %s\n' "$INPUT_PROXY_FORWARDING_PORT" > ${config_proxychains} && echo "File created: ${config_proxychains}"
            [ "$INPUT_DEBUG" == "true" ] && cat ${config_proxychains}
            show_hr
          else
            input_proxy="false"
            echo "::warning::Invalid input 'proxy-private-key'. Skipping proxy connection."
          fi
        fi

        {
          echo "debug $([ "$INPUT_DEBUG" == "true" ] && echo "9" || echo "false")"
          echo "set cmd:trace $([ "$INPUT_DEBUG" == "true" ] && echo "true" || echo "false")"
          echo "set ftp:ssl-protect-data true"
          echo "set ftp:sync-mode false"
          echo "set log:enabled/xfer true"
          echo "set log:file/xfer ~/transfer_log.txt"
          echo "set log:show-time/xfer false"
          echo "set mirror:overwrite true"
          echo "set mirror:parallel-transfer-count 3"
          echo "set mirror:set-permissions false"
          echo "set net:max-retries 1"
          echo "set net:persist-retries 0"
          echo "set net:timeout 10"
          echo "set sftp:auto-confirm true"
          echo "set ssl:check-hostname false"
          echo "set ssl:verify-certificate false"
          echo "set xfer:parallel 3"
          printf '%s\n' "$INPUT_FTP_OPTIONS"
        } > ~/.lftprc
        if [ "$INPUT_REMOTE_PROTOCOL" == "sftp" ] && [ "$INPUT_SSH_PRIVATE_KEY" != "" ]; then
          printf 'set sftp:connect-program /usr/bin/ssh -a -x -i ~/ssh_private_key %s\n' "$INPUT_SSH_OPTIONS" >> ~/.lftprc
        else
          printf 'set sftp:connect-program /usr/bin/ssh -a -x %s\n' "$INPUT_SSH_OPTIONS" >> ~/.lftprc
        fi
        printf 'open %s://%s@%s:%s\n' "$INPUT_REMOTE_PROTOCOL" "$INPUT_REMOTE_USER" "$INPUT_REMOTE_HOST" "$INPUT_REMOTE_PORT" >> ~/.lftprc
        echo "File created: ~/.lftprc"
        [ "$INPUT_DEBUG" == "true" ] && cat ~/.lftprc

        echo "::endgroup::"



        if [ "${input_proxy}" == "true" ]; then
          echo "::group::Setup proxy"

          if [ "$INPUT_PROXY_USER" != "" ] && [ "$INPUT_PROXY_HOST" != "" ]; then
            if ssh -A -D "$INPUT_PROXY_FORWARDING_PORT" -f -N -p "$INPUT_PROXY_PORT" -i ~/proxy_private_key "$INPUT_PROXY_USER@$INPUT_PROXY_HOST"; then
              echo "Proxy connected" && show_hr && echo "Proxy IP address: $(${proxy_cmd} curl --max-time 10 --show-error --silent "http://checkip.amazonaws.com/")"
            else
              echo "::error::Proxy connection failed."
              exit 1
            fi
          else
            input_proxy="false"
            echo "::warning::Invalid input 'proxy-user', 'proxy-host'. Skipping proxy connection."
          fi

          echo "::endgroup::"
        fi



        echo "::group::Prepare files"

        echo "Event: $GITHUB_EVENT_NAME_VAR
        Revision: https://github.com/$GITHUB_REPOSITORY_VAR/commit/$GITHUB_SHA_VAR
        Committer: $GITHUB_ACTOR_VAR
        Message: $GITHUB_HEAD_COMMIT_MESSAGE" && show_hr

        echo "$GITHUB_SHA_VAR" > "${local_path_slash}.deploy-revision" && echo "File created: ${local_path_slash}.deploy-revision" && cat "${local_path_slash}.deploy-revision" && show_hr

        if [ "${input_sync}" == "delta" ]; then
          touch ~/files_to_upload ~/files_to_delete
          git_depth=$(git rev-list --count --all)
          git_previous_commit=""

          if [ "${git_depth}" -gt 1 ]; then
            if [ "$GITHUB_EVENT_NAME_VAR" == "push" ]; then
              git_previous_commit="$GITHUB_EVENT_BEFORE"
            elif [ "$GITHUB_EVENT_NAME_VAR" == "pull_request" ]; then
              git_previous_commit="$GITHUB_PR_BASE_SHA"
            elif [ "$GITHUB_EVENT_NAME_VAR" == "workflow_dispatch" ]; then
              git_previous_commit=$(git rev-parse "$GITHUB_SHA_VAR"^)
            else
              echo "::error::Event not supported for delta synchronization: $GITHUB_EVENT_NAME_VAR. Supported events are 'push', 'pull_request' and 'workflow_dispatch'."
              exit 1
            fi
          else
            echo "::error::Commit history not found for delta synchronization. Please ensure you have 'fetch-depth: 0' option in checkout action. Please ignore if this is an initial commit or newly created branch."
            exit 1
          fi

          echo "Previous Revision: https://github.com/$GITHUB_REPOSITORY_VAR/commit/${git_previous_commit}" && show_hr

          # ${proxy_cmd} lftp -c "set log:enabled/xfer false; get -O ~ \"${remote_path_slash}.deploy-revision\"; exit 0"
          # echo -n "Remote Revision: " && [ -f ~/.deploy-revision ] && cat ~/.deploy-revision || echo ""
          # show_hr

          if git cat-file -t "${git_previous_commit}" &>/dev/null; then
            # Build git diff arguments safely
            excludes_args=()
            if [ -n "$INPUT_SYNC_DELTA_EXCLUDES" ]; then
              while IFS= read -r excl; do
                [ -n "$excl" ] && excludes_args+=("$excl")
              done <<< "$INPUT_SYNC_DELTA_EXCLUDES"
            fi
            git diff --diff-filter=ACMRT --name-only "${git_previous_commit}".."$GITHUB_SHA_VAR" -- "${local_path_unslash}" ':!/.git*' "${excludes_args[@]}" > ~/files_to_upload
            git diff-tree --diff-filter=D --name-only -t "${git_previous_commit}".."$GITHUB_SHA_VAR" -- "${local_path_unslash}" ':!/.git*' "${excludes_args[@]}" > ~/files_to_delete

            while IFS= read -r _line; do realpath --canonicalize-missing --relative-to="$local_path_unslash" "$_line"; done < ~/files_to_upload > ~/files_to_upload.tmp && mv ~/files_to_upload.tmp ~/files_to_upload
            while IFS= read -r _line; do realpath --canonicalize-missing --relative-to="$local_path_unslash" "$_line"; done < ~/files_to_delete > ~/files_to_delete.tmp && mv ~/files_to_delete.tmp ~/files_to_delete

            echo "File created: ~/files_to_upload" && cat ~/files_to_upload && show_hr
            echo "File created: ~/files_to_delete" && cat ~/files_to_delete && show_hr

            if [ "$INPUT_ARTIFACTS" == "true" ]; then
              echo "Copy transfer artifacts" && mkdir ~/transfer_files && rsync --verbose --files-from="$HOME/files_to_upload" "${local_path_slash}" ~/transfer_files/
            fi
          else
            echo "::warning::Invalid base commit for delta synchronization: ${git_previous_commit}. Please ignore if this is an initial commit or newly created branch."
          fi
        fi

        echo "::endgroup::"



        echo "::group::Transfer files"

        echo "Protocol: $INPUT_REMOTE_PROTOCOL
        Synchronization: ${input_sync}
        Local path: ${local_path_unslash}
        Remote path: ${remote_path_unslash}"

        [ "${input_sync}" == "delta" ] && echo -e "Upload files: $(wc --lines < ~/files_to_upload)\nDelete files: $(wc --lines < ~/files_to_delete)"

        show_hr

        touch "${local_path_slash}.deploy-running"

        if [ "${input_sync}" == "full" ]; then
          post_cmds="$INPUT_FTP_POST_SYNC_COMMANDS"
          lftp_script=$(mktemp)
          {
            printf 'put -O "%s" "%s";\n' "${remote_path_unslash}" "${local_path_slash}.deploy-running"
            mirror_opts=()
            if [ -n "$INPUT_FTP_MIRROR_OPTIONS" ]; then
              while IFS= read -r _opt; do
                [ -n "$_opt" ] && mirror_opts+=("$_opt")
              done <<< "$INPUT_FTP_MIRROR_OPTIONS"
            fi
            {
              printf 'mirror --exclude-glob=.git*/ --max-errors=10 --reverse'
              for _opt in "${mirror_opts[@]}"; do
                printf ' %s' "$_opt"
              done
              printf ' "%s" "%s";\n' "${local_path_unslash}" "${remote_path_unslash}"
            }
            printf 'rm -f "%s";\n' "${remote_path_slash}.deploy-running"
            printf '%s\n' "${post_cmds}"
          } > "${lftp_script}"
          ${proxy_cmd} lftp -f "${lftp_script}"
          rm -f "${lftp_script}"
        else
          post_cmds="$INPUT_FTP_POST_SYNC_COMMANDS"
          lftp_script=$(mktemp)
          {
            printf 'lcd "%s";\n' "${local_path_unslash}"
            printf 'put -O "%s" "%s";\n' "${remote_path_unslash}" "${local_path_slash}.deploy-running"
            printf 'mput -d -O "%s" .deploy-revision %s;\n' "${remote_path_unslash}" "$(awk '{ printf "\"%s\" ", $0 }' ~/files_to_upload)"
            printf 'rm -f "%s" %s;\n' "${remote_path_slash}.deploy-check" "$(awk -v REMOTEPATH="${remote_path_slash}" '{ printf "\"%s%s\" ", REMOTEPATH, $0 }' ~/files_to_delete)"
            printf 'rm -f "%s";\n' "${remote_path_slash}.deploy-running"
            printf '%s\n' "${post_cmds}"
          } > "${lftp_script}"
          ${proxy_cmd} lftp -f "${lftp_script}"
          rm -f "${lftp_script}"
        fi

        [ -f ~/transfer_log.txt ] && cat ~/transfer_log.txt

        echo "::endgroup::"



        echo "::group::Cleanup"

        [ "${input_proxy}" == "true" ] && sudo pkill ssh

        rm --force --verbose ~/.netrc ~/proxy_private_key ~/ssh_private_key

        [ "$INPUT_ARTIFACTS" != "true" ] && rm --force --verbose ~/transfer_log.txt

        [ "$INPUT_WEBHOOK" != "" ] && echo "Webhook notification (finish): $(send_webhook "finish")"

        echo "::endgroup::"

        exit 0
    - name: "Upload artifacts"
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: "transfer_artifacts"
        path: |
          ~/transfer_log.txt
          ~/transfer_files
        if-no-files-found: ignore
