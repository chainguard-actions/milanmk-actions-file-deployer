name: Test FTP with advanced inputs (ftp-options, ftp-mirror-options, ftp-post-sync-commands, webhook)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with advanced FTP inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "ftp"
          remote-host: "127.0.0.1"
          remote-port: "21"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: "full"
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--verbose"
          ftp-post-sync-commands: "echo done"
          webhook: "http://127.0.0.1:19999/webhook-does-not-exist"

      - name: Assert action ran with advanced FTP inputs (fails at connection, not validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at lftp connection (no real FTP server),
          # NOT at input validation. Valid protocol=ftp and sync=full pass validation.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with advanced ftp inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
