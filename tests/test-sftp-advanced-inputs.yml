name: Test SFTP with advanced inputs (ssh-private-key, ssh-options, sync-delta-excludes, artifacts, debug)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run action with advanced SFTP inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          ssh-private-key: "-----BEGIN OPENSSH PRIVATE KEY-----\nfakekey\n-----END OPENSSH PRIVATE KEY-----"
          ssh-options: "-o ConnectTimeout=5"
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: "delta"
          sync-delta-excludes: "*.log *.tmp"
          artifacts: "true"
          debug: "true"

      - name: Assert action ran with advanced inputs (fails at connection, not validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at lftp/ssh connection (no real server),
          # NOT at input validation. Valid protocol=sftp and sync=delta pass validation.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with advanced sftp inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
