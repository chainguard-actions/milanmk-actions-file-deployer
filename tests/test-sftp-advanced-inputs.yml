name: Test SFTP advanced inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: nonexistent.example.invalid
          remote-port: 22
          remote-user: testuser
          remote-password: testpassword
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            ZmFrZWtleWZvcnRlc3Rpbmcx
            -----END OPENSSH PRIVATE KEY-----
          ssh-options: "-o ConnectTimeout=5"
          local-path: .
          remote-path: /upload
          sync: full
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--verbose"
          ftp-post-sync-commands: "echo done"
          artifacts: "false"
          debug: "false"
      - name: Assert action ran (fails gracefully on nonexistent host)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (host resolved?)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully on nonexistent remote host"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
