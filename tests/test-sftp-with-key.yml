name: Test SFTP with SSH private key and options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a second commit so delta sync has history
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "test" > /tmp/dummy_file_for_delta.txt
          cp /tmp/dummy_file_for_delta.txt "$GITHUB_WORKSPACE/dummy_delta.txt"
          git add "$GITHUB_WORKSPACE/dummy_delta.txt"
          git commit -m "Add dummy file for delta test" || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: 127.0.0.1
          remote-port: 22
          remote-user: testuser
          remote-password: testpass
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            ZmFrZWtleWZvcnRlc3Rpbmcx
            -----END OPENSSH PRIVATE KEY-----
          ssh-options: "-o ConnectTimeout=5"
          sync: delta
          sync-delta-excludes: "*.log *.tmp"
          local-path: .
          remote-path: /tmp/deploy
          artifacts: "true"
          debug: "false"
      - name: Assert action ran (connection expected to fail on fake host)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake host not reachable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
