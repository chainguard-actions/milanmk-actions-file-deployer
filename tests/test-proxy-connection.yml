name: Test FTP with proxy connection inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: nonexistent.example.invalid
          remote-port: 22
          remote-user: testuser
          remote-password: testpass
          local-path: .
          remote-path: /remote/path
          sync: full
          proxy: "true"
          proxy-host: proxy.example.invalid
          proxy-port: 22
          proxy-forwarding-port: 1080
          proxy-user: proxyuser
          proxy-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            ZmFrZXByb3h5a2V5Zm9ydGVzdGluZw==
            -----END OPENSSH PRIVATE KEY-----
          debug: "false"
      - name: Assert action ran and failed gracefully at proxy connection (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - cannot connect to nonexistent proxy host)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
