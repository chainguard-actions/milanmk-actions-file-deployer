name: Test FTP options with full sync
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: ftp
          remote-host: 192.0.2.1
          remote-port: 21
          remote-user: ftpuser
          remote-password: ftppassword
          local-path: .
          remote-path: /remote/path
          sync: full
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--parallel=2"
          ftp-post-sync-commands: "echo done"
      - name: Assert action ran with ftp-options, ftp-mirror-options, ftp-post-sync-commands
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at lftp connection (no real FTP server), but it must
          # have processed the ftp-options, ftp-mirror-options, and ftp-post-sync-commands inputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ftp-options, ftp-mirror-options, ftp-post-sync-commands inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
