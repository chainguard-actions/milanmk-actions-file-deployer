name: Test artifacts and webhook inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: sftp.example.invalid
          remote-port: 22
          remote-user: testuser
          remote-password: testpassword
          local-path: .
          remote-path: /upload
          sync: full
          artifacts: "true"
          webhook: "https://webhook.example.invalid/notify"
      - name: Assert action ran with artifacts and webhook inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at connection (no real SFTP server),
          # but it must have accepted the artifacts and webhook inputs.
          # The webhook call will also fail (invalid URL) but that is non-fatal.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully at connection stage (no real SFTP server)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
