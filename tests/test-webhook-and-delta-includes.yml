name: Test webhook and delta includes inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: 127.0.0.1
          remote-port: 22
          remote-user: testuser
          remote-password: testpass
          local-path: .
          remote-path: /tmp/deploy
          sync: delta
          sync-delta-includes: "hardened/tests"
          webhook: "https://httpbin.org/post"
      - name: Assert action ran (expected to fail connecting to 127.0.0.1)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real SFTP server available?)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real SFTP server)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
