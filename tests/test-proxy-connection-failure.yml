name: Test proxy enabled with unreachable proxy host
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "ftp"
          remote-host: "127.0.0.1"
          remote-port: "21"
          remote-user: "testuser"
          remote-password: "testpassword"
          proxy: "true"
          proxy-host: "127.0.0.1"
          proxy-port: "1"
          proxy-forwarding-port: "1081"
          proxy-user: "proxyuser"
          proxy-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dummy-proxy-key
            -----END OPENSSH PRIVATE KEY-----
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: "full"
      - name: Assert proxy setup attempted and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since proxy is unreachable, got '$OUTCOME'"
            exit 1
          fi
          if [ -f ~/.proxychains/proxychains.conf ]; then
            cat ~/.proxychains/proxychains.conf
            if ! grep -q 'socks5 127.0.0.1 1081' ~/.proxychains/proxychains.conf; then
              echo "FAIL: proxychains config does not use forwarding port"
              exit 1
            fi
          else
            echo "INFO: proxychains config not created (failed before configuration stage)"
          fi
          echo "PASS"
