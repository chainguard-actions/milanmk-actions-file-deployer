name: Test SFTP protocol with delta sync validation
on:
  workflow_dispatch:
    inputs:
      sync:
        description: "Sync type"
        required: false
        default: "delta"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run action with SFTP protocol and delta sync
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "localhost"
          remote-port: 22
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: "delta"

      - name: Assert action failed at connection (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no real SFTP server,
          # but it must have passed input validation (protocol=sftp, sync=delta are valid).
          # We expect failure (connection refused), not success.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real SFTP server), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed at connection stage as expected (validation passed)"
