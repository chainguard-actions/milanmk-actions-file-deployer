name: Test debug mode with valid inputs

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/remote"
          sync: "full"
          debug: "true"

      - name: Assert action ran with debug mode enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at the lftp connection step (no real server),
          # but it should NOT fail at validation with debug=true and valid inputs.
          # Debug mode outputs additional context information before the connection attempt.
          echo "PASS: action ran with debug mode enabled (may fail at connection, which is expected)"
