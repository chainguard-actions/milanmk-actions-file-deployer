name: Test debug mode enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/remote"
          sync: "full"
          debug: "true"

      - name: Assert action ran with debug mode (did not fail at validation)
        run: |
          # With debug=true, the action outputs context and env info before proceeding.
          # The action will fail at lftp connection, not at validation.
          # We verify the action did not fail due to invalid protocol or sync validation.
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: debug mode was accepted and action proceeded past validation"
