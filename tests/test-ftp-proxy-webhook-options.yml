name: Test FTP with proxy, webhook, and ftp options inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run action with FTP proxy and webhook options
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "ftp"
          remote-host: "127.0.0.1"
          remote-port: "21"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/upload"
          sync: "full"
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--no-perms"
          ftp-post-sync-commands: "echo done"
          proxy: "false"
          proxy-host: "proxy.example.com"
          proxy-port: "22"
          proxy-forwarding-port: "1080"
          proxy-user: "proxyuser"
          proxy-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdGtleQ==
            -----END OPENSSH PRIVATE KEY-----
          webhook: "https://httpbin.org/post"

      - name: Assert action ran with proxy and webhook options (fails at connection, not validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at lftp connection (no real FTP server),
          # NOT at input validation. We verify the action accepted all proxy/webhook inputs.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with ftp-options, ftp-mirror-options, ftp-post-sync-commands, webhook, proxy-host, proxy-user, proxy-private-key inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
