name: Test SSH private key and related inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a second commit so delta sync has history
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "test" > /tmp/dummy.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: "192.0.2.1"
          remote-port: 22
          remote-user: testuser
          remote-password: ""
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdGtleQ==
            -----END OPENSSH PRIVATE KEY-----
          ssh-options: "-o ConnectTimeout=5"
          local-path: "."
          remote-path: "/remote/path"
          sync: full
          sync-delta-excludes: "*.log"
          artifacts: "false"
          debug: "false"
      - name: Assert action ran (connection expected to fail on fake host)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - no real server at 192.0.2.1)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
