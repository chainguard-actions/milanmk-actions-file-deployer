name: Test SSH private key, SSH options, and sync-delta-excludes inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run action with ssh-private-key, ssh-options, and sync-delta-excludes
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          ssh-private-key: "-----BEGIN OPENSSH PRIVATE KEY-----\nfake-key-for-testing\n-----END OPENSSH PRIVATE KEY-----"
          ssh-options: "-o ConnectTimeout=5"
          local-path: "."
          remote-path: "/upload"
          sync: "delta"
          sync-delta-excludes: "*.log *.tmp"
          proxy: "false"

      - name: Assert action ran (ssh-private-key, ssh-options, sync-delta-excludes accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at lftp/ssh connection (no real server),
          # NOT at input validation. We verify the action accepted the
          # ssh-private-key, ssh-options, and sync-delta-excludes inputs.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with ssh-private-key, ssh-options, sync-delta-excludes (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
