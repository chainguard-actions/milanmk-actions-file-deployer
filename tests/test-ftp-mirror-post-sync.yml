name: Test FTP full sync with mirror options and post-sync commands
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "ftp"
          remote-host: "127.0.0.1"
          remote-port: "1"
          remote-user: "testuser"
          remote-password: "testpassword"
          ftp-options: "set ftp:passive-mode true"
          ftp-mirror-options: "--verbose --exclude-glob=*.md"
          ftp-post-sync-commands: "ls"
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: "full"
      - name: Assert action reached transfer stage
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ] && [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ ! -f ~/.lftprc ]; then
            echo "FAIL: ~/.lftprc not created"
            exit 1
          fi
          cat ~/.lftprc
          if ! grep -q 'set ftp:passive-mode true' ~/.lftprc; then
            echo "FAIL: ftp-options missing"
            exit 1
          fi
          if ! grep -q 'open ftp://testuser@127.0.0.1:1' ~/.lftprc; then
            echo "FAIL: open line missing"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/.deploy-revision" ]; then
            echo "FAIL: .deploy-revision not created (prepare stage not reached)"
            exit 1
          fi
          echo "PASS"
