name: Test FTP full sync with ftp-options, ftp-mirror-options, ftp-post-sync-commands, and artifacts
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run action with ftp-options, ftp-mirror-options, ftp-post-sync-commands, artifacts
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "ftp"
          remote-host: "127.0.0.1"
          remote-port: "21"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/upload"
          sync: "full"
          proxy: "false"
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--no-perms"
          ftp-post-sync-commands: "echo done"
          artifacts: "true"

      - name: Assert action ran with ftp-options, ftp-mirror-options, ftp-post-sync-commands, artifacts inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at lftp connection (no real FTP server),
          # but it must NOT fail at input validation.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with ftp-options, ftp-mirror-options, ftp-post-sync-commands, artifacts inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
