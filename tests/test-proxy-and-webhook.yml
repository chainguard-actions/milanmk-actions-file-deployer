name: Test FTP with proxy settings and webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: ftp
          remote-host: 127.0.0.1
          remote-port: 21
          remote-user: testuser
          remote-password: testpass
          proxy: "true"
          proxy-host: 127.0.0.1
          proxy-port: 22
          proxy-forwarding-port: 1080
          proxy-user: proxyuser
          proxy-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            ZmFrZWtleQ==
            -----END OPENSSH PRIVATE KEY-----
          local-path: .
          remote-path: /tmp/deploy
          sync: full
          webhook: "https://httpbin.org/post"
          debug: "false"
      - name: Assert action ran (input coverage check)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at proxy/connection stage since 127.0.0.1 is not a real proxy
          # but we verify it ran (not skipped) to confirm inputs were accepted
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with proxy-host, proxy-user, proxy-private-key, webhook inputs"
