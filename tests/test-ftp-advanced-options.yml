name: Test FTP advanced options coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: ftp
          remote-host: 192.0.2.1
          remote-port: 21
          remote-user: ftpuser
          remote-password: ftppassword
          ftp-options: "set net:timeout 15"
          ftp-mirror-options: "--verbose"
          ftp-post-sync-commands: "echo done"
          local-path: .
          remote-path: /var/www
          sync: full
      - name: Assert action ran (fails gracefully on no real FTP server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real FTP server)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
