name: Test proxy configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "localhost"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpassword"
          proxy: "true"
          proxy-host: "proxy.example.com"
          proxy-port: "22"
          proxy-forwarding-port: "1080"
          proxy-user: "proxyuser"
          proxy-private-key: "-----BEGIN OPENSSH PRIVATE KEY-----\nfakeproxykey\n-----END OPENSSH PRIVATE KEY-----"
          local-path: "."
          remote-path: "/tmp/remote"
          sync: "full"
      - name: Assert action outcome is failure or success (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" == "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: $OUTCOME)"
