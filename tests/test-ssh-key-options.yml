name: Test SSH private key and SSH options inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run action with ssh-private-key and ssh-options
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdGtleQ==
            -----END OPENSSH PRIVATE KEY-----
          ssh-options: "-o ConnectTimeout=5"
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: "full"

      - name: Assert action ran (ssh-private-key and ssh-options inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at lftp connection (no real server),
          # NOT at input validation. ssh-private-key and ssh-options are valid inputs.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with ssh-private-key/ssh-options inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
