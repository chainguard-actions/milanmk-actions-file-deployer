name: Test delta sync with includes and excludes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: sftp.example.invalid
          remote-port: 22
          remote-user: testuser
          remote-password: testpassword
          local-path: .
          remote-path: /upload
          sync: delta
          sync-delta-excludes: "*.log *.tmp"
          sync-delta-includes: "README.md"
      - name: Assert action ran with sync-delta-excludes and sync-delta-includes inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at connection (no real server),
          # but it must have accepted the sync-delta-excludes and sync-delta-includes inputs.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully at connection stage (no real SFTP server)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
