name: Test proxy and webhook inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with proxy and webhook inputs (invalid protocol to fail fast)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: invalid
          remote-host: example.com
          remote-port: 22
          remote-user: testuser
          remote-password: testpass
          proxy: "false"
          proxy-host: proxy.example.com
          proxy-port: 22
          proxy-forwarding-port: 1080
          proxy-user: proxyuser
          proxy-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            fakekeydata
            -----END OPENSSH PRIVATE KEY-----
          local-path: .
          remote-path: /deploy
          sync: full
          webhook: "https://example.com/webhook"
      - name: Assert action failed due to invalid protocol
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid protocol"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid protocol"
