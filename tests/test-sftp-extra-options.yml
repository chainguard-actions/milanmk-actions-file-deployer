name: Test SFTP with extra options (ssh-private-key, ssh-options, sync-delta-excludes, debug, artifacts)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run action with SFTP and extra options
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdGtleQ==
            -----END OPENSSH PRIVATE KEY-----
          ssh-options: "-o ConnectTimeout=5"
          local-path: "."
          remote-path: "/upload"
          sync: "delta"
          sync-delta-excludes: "*.log *.tmp"
          proxy: "false"
          debug: "true"
          artifacts: "true"

      - name: Assert action ran with extra options (fails at connection, not validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at lftp/ssh connection (no real server),
          # NOT at input validation. We verify the action accepted all extra inputs.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with ssh-private-key, ssh-options, sync-delta-excludes, debug, artifacts inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
