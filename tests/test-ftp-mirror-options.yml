name: Test FTP with mirror options, ftp options, and post-sync commands
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: ftp
          remote-host: 127.0.0.1
          remote-port: 21
          remote-user: testuser
          remote-password: testpass
          local-path: .
          remote-path: /tmp/deploy
          sync: full
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--verbose"
          ftp-post-sync-commands: "echo done"
          debug: "false"
      - name: Assert action ran (input coverage check)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at connection since 127.0.0.1:21 is not available
          # but we verify it ran (not skipped) to confirm inputs were accepted
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with ftp-options, ftp-mirror-options, ftp-post-sync-commands inputs"
