name: Test SFTP options input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: invalid-protocol
          remote-host: example.com
          remote-port: 22
          remote-user: testuser
          remote-password: testpass
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dummykeydata
            -----END OPENSSH PRIVATE KEY-----
          ssh-options: "-o ConnectTimeout=5"
          sync: delta
          sync-delta-excludes: "*.log *.tmp"
          local-path: .
          remote-path: /remote/path
          debug: "true"
          artifacts: "false"
          webhook: ""
      - name: Assert action failed with invalid protocol error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid protocol"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid protocol"
