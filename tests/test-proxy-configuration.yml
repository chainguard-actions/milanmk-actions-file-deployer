name: Test proxy configuration inputs

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        name: Run action with proxy-host, proxy-user, and proxy-private-key
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "localhost"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpassword"
          proxy: "true"
          proxy-host: "proxy.example.com"
          proxy-port: "22"
          proxy-forwarding-port: "1080"
          proxy-user: "proxyuser"
          proxy-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          local-path: "."
          remote-path: "/tmp/remote"
          sync: "delta"

      - name: Assert action ran (failed at proxy connection, not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at proxy connection stage (no real proxy server),
          # but proxy-host, proxy-user, and proxy-private-key inputs should be accepted.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at proxy/connection stage as expected (inputs accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
