name: Test SSH private key and SSH options inputs

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run action with ssh-private-key and ssh-options (expect failure at connection, not validation)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            ZmFrZWtleWZvcnRlc3Rpbmcx
            -----END OPENSSH PRIVATE KEY-----
          ssh-options: "-o ConnectTimeout=5"
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: "full"

      - name: Assert action ran with ssh-private-key and ssh-options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the lftp/ssh connection step (no real SFTP server),
          # not at the validation step. We verify the action ran
          # (outcome is not 'skipped' or 'cancelled').
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly skipped or cancelled"
            exit 1
          fi
          echo "PASS: action ran with ssh-private-key and ssh-options (failed at connection as expected)"
