name: Test SFTP delta sync input validation passes
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run action with valid sftp protocol and delta sync
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/upload"
          sync: "delta"
          proxy: "false"

      - name: Assert action did not fail on input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at lftp connection (no real server),
          # NOT at input validation. We verify the action ran with valid
          # sftp/delta inputs without a validation error.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with valid sftp/delta inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
