name: Test invalid protocol validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "invalid-protocol"
          remote-host: "localhost"
          remote-port: "22"
          remote-user: "testuser"
          local-path: "."
          remote-path: "/tmp/remote"
          sync: "delta"
      - name: Assert action failed due to invalid protocol
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid protocol, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid protocol"
