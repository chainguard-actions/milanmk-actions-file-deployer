name: Test proxy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpass"
          proxy: "true"
          proxy-host: "proxy.example.com"
          proxy-port: "22"
          proxy-forwarding-port: "1080"
          proxy-user: "proxyuser"
          proxy-private-key: "-----BEGIN OPENSSH PRIVATE KEY-----\ndummyproxykeydata\n-----END OPENSSH PRIVATE KEY-----"
          local-path: "."
          remote-path: "/remote"
          sync: "full"

      - name: Assert action passed validation for proxy inputs
        run: |
          # The action should fail at proxy SSH connection (no real proxy server),
          # not at input validation. proxy-host, proxy-user, and proxy-private-key
          # are all valid optional inputs.
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: proxy-host, proxy-user, and proxy-private-key inputs were accepted"
