name: Test proxy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: 127.0.0.1
          remote-port: 22
          remote-user: testuser
          remote-password: testpass
          proxy: true
          proxy-host: 127.0.0.1
          proxy-port: 22
          proxy-forwarding-port: 1080
          proxy-user: proxyuser
          proxy-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            ZmFrZXByb3h5a2V5Zm9ydGVzdGluZw==
            -----END OPENSSH PRIVATE KEY-----
          local-path: .
          remote-path: /tmp/deploy
          sync: full
      - name: Assert action ran with proxy inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at proxy setup (can't SSH to 127.0.0.1)
          # but it must NOT fail at input validation
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at proxy/transfer step as expected (no real proxy server)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
