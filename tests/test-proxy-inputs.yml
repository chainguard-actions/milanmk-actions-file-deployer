name: Test proxy inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "invalid-protocol"
          remote-host: "localhost"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpass"
          proxy: "false"
          proxy-host: "proxy.example.com"
          proxy-port: "22"
          proxy-forwarding-port: "1080"
          proxy-user: "proxyuser"
          proxy-private-key: "-----BEGIN OPENSSH PRIVATE KEY-----\nfakeproxykey\n-----END OPENSSH PRIVATE KEY-----"
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: "full"
          debug: "false"
          artifacts: "false"
      - name: Assert action failed due to invalid protocol
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid protocol, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid protocol (proxy inputs were accepted)"
