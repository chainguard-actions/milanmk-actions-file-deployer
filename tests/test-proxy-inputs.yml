name: Test proxy inputs (proxy-host, proxy-user, proxy-private-key)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with proxy inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: "full"
          proxy: "true"
          proxy-host: "127.0.0.1"
          proxy-port: "22"
          proxy-forwarding-port: "1080"
          proxy-user: "proxyuser"
          proxy-private-key: "-----BEGIN OPENSSH PRIVATE KEY-----\nfakeproxykey\n-----END OPENSSH PRIVATE KEY-----"

      - name: Assert action ran with proxy inputs (fails at proxy connection, not validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at proxy SSH connection (no real proxy server),
          # NOT at input validation. Valid protocol=sftp and sync=full pass validation.
          # Proxy inputs are consumed before the connection attempt.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with proxy inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
