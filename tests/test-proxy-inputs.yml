name: Test proxy inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: ftp
          remote-host: nonexistent.example.invalid
          remote-port: 21
          remote-user: testuser
          remote-password: testpassword
          proxy: "true"
          proxy-host: proxy.example.invalid
          proxy-port: 22
          proxy-forwarding-port: 1080
          proxy-user: proxyuser
          proxy-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            ZmFrZWtleWZvcnRlc3Rpbmcx
            -----END OPENSSH PRIVATE KEY-----
          local-path: .
          remote-path: /upload
          sync: full
          debug: "false"
      - name: Assert action ran (fails gracefully on nonexistent proxy host)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully on nonexistent proxy host"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
