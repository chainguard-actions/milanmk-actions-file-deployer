name: Test proxy inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Run action with proxy-host, proxy-user, proxy-private-key (expect failure at network)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "localhost"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpass"
          proxy: "true"
          proxy-host: "proxy.example.com"
          proxy-port: "22"
          proxy-forwarding-port: "1080"
          proxy-user: "proxyuser"
          proxy-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdGtleQ==
            -----END OPENSSH PRIVATE KEY-----
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: "full"
      - name: Assert action did not fail at input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at network/proxy connection stage, not at input validation.
          # proxy-host, proxy-user, proxy-private-key are optional inputs that should be accepted.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with proxy inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
