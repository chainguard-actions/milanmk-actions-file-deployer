name: Test SFTP advanced options (ssh-key, debug, artifacts, webhook, delta options)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: 127.0.0.1
          remote-port: 22
          remote-user: testuser
          remote-password: testpass
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          ssh-options: "-o ConnectTimeout=5"
          local-path: .
          remote-path: /tmp/deploy
          sync: delta
          sync-delta-excludes: "*.log *.tmp"
          sync-delta-includes: "README.md"
          debug: "true"
          artifacts: "true"
          webhook: "https://example.com/webhook"
      - name: Assert action ran (connection failure is expected)
        run: |
          echo "Action completed with continue-on-error. Input coverage verified."
          echo "PASS"
