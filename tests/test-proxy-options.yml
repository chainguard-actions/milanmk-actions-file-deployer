name: Test proxy options (proxy-host, proxy-user, proxy-private-key)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: ftp
          remote-host: 127.0.0.1
          remote-port: 21
          remote-user: testuser
          remote-password: testpass
          proxy: "true"
          proxy-host: proxy.example.com
          proxy-port: 22
          proxy-forwarding-port: 1080
          proxy-user: proxyuser
          proxy-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          local-path: .
          remote-path: /tmp/deploy
          sync: full
          debug: "false"
      - name: Assert action ran (connection failure is expected)
        run: |
          echo "Action completed with continue-on-error. Input coverage verified."
          echo "PASS"
