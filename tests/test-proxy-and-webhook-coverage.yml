name: Test proxy and webhook input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: "192.0.2.1"
          remote-port: 22
          remote-user: testuser
          remote-password: ""
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: full
          proxy: "true"
          proxy-host: "192.0.2.2"
          proxy-port: 22
          proxy-forwarding-port: 1080
          proxy-user: proxyuser
          proxy-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            ZmFrZXByb3h5a2V5Zm9ydGVzdGluZw==
            -----END OPENSSH PRIVATE KEY-----
          webhook: "https://httpbin.org/post"
          artifacts: "false"
          debug: "false"
      - name: Assert action ran (proxy/connection expected to fail on test host)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real proxy/SFTP server available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
