name: Test delta sync validation passes

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run action with delta sync (expect failure at connection, not validation)
        id: action
        uses: .
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/remote"
          sync: "delta"
        continue-on-error: true

      - name: Assert action ran past validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the lftp/ssh connection step (no real SFTP server),
          # not at the sync type validation step. We verify the action ran
          # (outcome is not 'skipped' or 'cancelled').
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly skipped or cancelled"
            exit 1
          fi
          echo "PASS: action ran (delta sync accepted by validation, failed at connection as expected)"
