name: Test FTP with extra options (ftp-options, ftp-mirror-options, ftp-post-sync-commands)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        name: Run action with ftp-options, ftp-mirror-options, and ftp-post-sync-commands
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "ftp"
          remote-host: "localhost"
          remote-port: "21"
          remote-user: "testuser"
          remote-password: "testpassword"
          local-path: "."
          remote-path: "/tmp/remote"
          sync: "full"
          ftp-options: "set net:timeout 15"
          ftp-mirror-options: "--verbose"
          ftp-post-sync-commands: "echo done"

      - name: Assert action ran (failed at connection, not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at connection stage (no real FTP server),
          # but ftp-options, ftp-mirror-options, and ftp-post-sync-commands inputs should be accepted.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at connection stage as expected (inputs accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
