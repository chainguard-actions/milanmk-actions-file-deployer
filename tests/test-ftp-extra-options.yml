name: Test FTP extra options inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run action with ftp-options, ftp-mirror-options, and ftp-post-sync-commands
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "ftp"
          remote-host: "127.0.0.1"
          remote-port: "21"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/upload"
          sync: "full"
          proxy: "false"
          ftp-options: "set net:timeout 15"
          ftp-mirror-options: "--verbose"
          ftp-post-sync-commands: "echo done"

      - name: Assert action ran with ftp extra options inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at lftp connection (no real server),
          # but it must have accepted the ftp-options, ftp-mirror-options,
          # and ftp-post-sync-commands inputs and progressed past validation.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with ftp extra options inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
