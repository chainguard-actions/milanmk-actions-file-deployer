name: Test SFTP with SSH key and options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Assert invalid protocol fails fast
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: invalid
          remote-host: example.com
          remote-port: 22
          remote-user: testuser
          remote-password: testpass
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            fakekeydata
            -----END OPENSSH PRIVATE KEY-----
          ssh-options: "-o ConnectTimeout=5"
          local-path: .
          remote-path: /deploy
          sync: delta
          sync-delta-excludes: "*.log"
          artifacts: "false"
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--parallel=2"
          ftp-post-sync-commands: ""
      - name: Assert action failed due to invalid protocol
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid protocol"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid protocol"
