name: Test delta sync includes and excludes inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: 127.0.0.1
          remote-port: 22
          remote-user: testuser
          remote-password: testpass
          local-path: .
          remote-path: /tmp/deploy
          sync: delta
          sync-delta-includes: "README.md,action.yml"
          sync-delta-excludes: "*.log"
      - name: Assert action ran with sync-delta-includes and sync-delta-excludes inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at the transfer step (can't connect to 127.0.0.1)
          # but it must NOT fail at input validation
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at transfer step as expected (no real SFTP server)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
