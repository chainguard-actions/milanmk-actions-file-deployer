name: Test proxy settings inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: sftp.example.invalid
          remote-port: 22
          remote-user: testuser
          remote-password: testpassword
          proxy: true
          proxy-host: proxy.example.invalid
          proxy-port: 22
          proxy-forwarding-port: 1080
          proxy-user: proxyuser
          proxy-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdGtleQ==
            -----END OPENSSH PRIVATE KEY-----
          local-path: .
          remote-path: /upload
          sync: full
      - name: Assert action ran with proxy-host, proxy-user, and proxy-private-key inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at connection (no real proxy/SFTP server),
          # but it must have accepted the proxy-host, proxy-user, and proxy-private-key inputs.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully at connection stage (no real proxy server)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
