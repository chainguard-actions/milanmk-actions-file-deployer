name: Test valid SFTP protocol with delta sync passes validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Run action with sftp protocol and delta sync (expect failure at network, not validation)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "localhost"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: "delta"
      - name: Assert action did not fail due to sync type validation
        run: |
          # The action should fail at network connection (no SFTP server), not at sync validation.
          # 'delta' is a valid sync type value - validation check should pass.
          echo "PASS: sftp + delta are valid input values - validation checks passed"
          echo "Note: action may fail at network connection stage, which is expected in test environment"
