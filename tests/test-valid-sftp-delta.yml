name: Test valid SFTP protocol with delta sync
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/remote"
          sync: "delta"

      - name: Assert action did not fail due to protocol or sync validation
        run: |
          # The action should fail at lftp connection (not at validation).
          # Both "sftp" protocol and "delta" sync are valid inputs.
          # The action will fail when trying to connect to 127.0.0.1:22 (no SSH server).
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: sftp protocol and delta sync were accepted by validation"
