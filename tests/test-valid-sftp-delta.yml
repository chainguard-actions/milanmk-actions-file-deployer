name: Test valid SFTP protocol with delta sync passes validation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create additional commit so delta sync has history
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "test" > /tmp/test-marker.txt
          # We need git depth > 1 for delta sync to work
          # Check current depth
          depth=$(git rev-list --count --all)
          echo "Git depth: $depth"

      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/remote"
          sync: "delta"

      - name: Assert action did not fail on protocol or sync validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at the lftp connection step (no real server),
          # but it should NOT fail with "Invalid protocol" or "Invalid synchronization" error.
          # Both 'sftp' and 'delta' are valid inputs.
          echo "PASS: action ran with valid sftp protocol and delta sync (may fail at connection, which is expected)"
