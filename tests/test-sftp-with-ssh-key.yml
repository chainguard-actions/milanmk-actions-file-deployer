name: Test SFTP with SSH private key and options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: 192.0.2.1
          remote-port: 22
          remote-user: testuser
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5
            -----END OPENSSH PRIVATE KEY-----
          ssh-options: "-o ConnectTimeout=5"
          local-path: .
          remote-path: /remote/path
          sync: full
          artifacts: "false"
      - name: Assert action ran with ssh-private-key and ssh-options inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at lftp connection (no real server), but it must
          # have processed the ssh-private-key and ssh-options inputs.
          # We accept both success (unlikely) and failure (expected - no real server).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ssh-private-key and ssh-options inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
