name: Test SFTP with SSH private key, ssh-options, and artifacts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: nonexistent.example.invalid
          remote-port: 22
          remote-user: testuser
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdGtleQ==
            -----END OPENSSH PRIVATE KEY-----
          ssh-options: "-o ConnectTimeout=5"
          local-path: .
          remote-path: /upload
          sync: full
          artifacts: "true"
      - name: Assert action processed ssh-private-key, ssh-options, and artifacts inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - no real SFTP host)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
