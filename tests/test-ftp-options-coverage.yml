name: Test FTP with ftp-options, ftp-mirror-options, ftp-post-sync-commands
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: ftp
          remote-host: 192.0.2.1
          remote-port: 21
          remote-user: ftpuser
          remote-password: ftppassword
          local-path: .
          remote-path: /remote/path
          sync: full
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--no-perms"
          ftp-post-sync-commands: "echo done"
          debug: "false"
      - name: Assert action ran (fails at connection with fake host, but inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully at connection stage (expected with fake host)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
