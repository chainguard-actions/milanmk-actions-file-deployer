name: Test FTP options input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: invalid-protocol
          remote-host: example.com
          remote-port: 21
          remote-user: ftpuser
          remote-password: ftppass
          sync: full
          local-path: .
          remote-path: /remote/path
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--parallel=2"
          ftp-post-sync-commands: "echo done"
          webhook: "https://example.com/webhook"
          debug: "false"
          artifacts: "false"
      - name: Assert action failed with invalid protocol error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid protocol"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid protocol"
