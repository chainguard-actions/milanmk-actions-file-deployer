name: Test FTP full sync with ftp options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "ftp"
          remote-host: "localhost"
          remote-port: "21"
          remote-user: "testuser"
          remote-password: "testpassword"
          local-path: "."
          remote-path: "/tmp/remote"
          sync: "full"
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--parallel=2"
          ftp-post-sync-commands: "echo done"
      - name: Assert action outcome is failure or success (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" == "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: $OUTCOME)"
