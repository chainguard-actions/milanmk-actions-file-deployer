name: Test FTP full sync with mirror and post-sync options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: ftp
          remote-host: 127.0.0.1
          remote-port: 21
          remote-user: testuser
          remote-password: testpass
          local-path: .
          remote-path: /tmp/deploy
          sync: full
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--no-perms --no-umask"
          ftp-post-sync-commands: "echo done"
          artifacts: "false"
          debug: "false"
      - name: Assert action ran (connection expected to fail on loopback)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real FTP server available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
