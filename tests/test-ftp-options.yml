name: Test FTP options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: ftp
          remote-host: 127.0.0.1
          remote-port: 21
          remote-user: testuser
          remote-password: testpass
          local-path: .
          remote-path: /tmp/deploy
          sync: full
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--no-perms"
          ftp-post-sync-commands: "echo done"
      - name: Assert action ran with ftp-options, ftp-mirror-options, and ftp-post-sync-commands inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at the transfer step (can't connect to 127.0.0.1:21)
          # but it must NOT fail at input validation
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at transfer step as expected (no real FTP server)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
