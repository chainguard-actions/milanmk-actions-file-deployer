name: Test FTP options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "ftp"
          remote-host: "127.0.0.1"
          remote-port: "21"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/remote"
          sync: "full"
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--verbose"
          ftp-post-sync-commands: "echo done"

      - name: Assert action passed validation for ftp inputs
        run: |
          # The action should fail at lftp connection (no real FTP server),
          # not at input validation. ftp-options, ftp-mirror-options, and
          # ftp-post-sync-commands are all valid optional inputs.
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: ftp-options, ftp-mirror-options, and ftp-post-sync-commands inputs were accepted"
