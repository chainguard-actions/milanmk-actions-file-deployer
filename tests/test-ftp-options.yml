name: Test FTP options inputs (ftp-options, ftp-mirror-options, ftp-post-sync-commands)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with ftp-options, ftp-mirror-options, ftp-post-sync-commands
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "ftp"
          remote-host: "127.0.0.1"
          remote-port: "21"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: "full"
          ftp-options: "set net:timeout 5"
          ftp-mirror-options: "--no-perms"
          ftp-post-sync-commands: "echo done"

      - name: Assert action ran (ftp options inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at lftp connection (no real FTP server),
          # NOT at input validation. ftp-options, ftp-mirror-options, ftp-post-sync-commands are valid inputs.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with ftp options inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
