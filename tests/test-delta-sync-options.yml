name: Test delta sync with excludes and includes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: 192.0.2.1
          remote-port: 22
          remote-user: testuser
          remote-password: testpassword
          local-path: .
          remote-path: /remote/path
          sync: delta
          sync-delta-excludes: "*.log *.tmp"
          sync-delta-includes: "README.md"
      - name: Assert action ran with sync-delta-excludes and sync-delta-includes inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at lftp connection (no real server), but it must
          # have processed the sync-delta-excludes and sync-delta-includes inputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with sync-delta-excludes and sync-delta-includes inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
