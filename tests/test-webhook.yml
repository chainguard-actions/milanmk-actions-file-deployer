name: Test webhook input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run action with webhook input
        id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpass"
          local-path: "."
          remote-path: "/tmp/deploy"
          sync: "full"
          webhook: "http://127.0.0.1:19999/webhook"

      - name: Assert action ran (webhook input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at lftp connection (no real server).
          # The webhook call will also fail (no server at 127.0.0.1:19999),
          # but the action continues past that. The webhook input is accepted.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with webhook input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
