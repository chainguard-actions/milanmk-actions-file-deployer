name: Test SFTP with SSH key and options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: sftp
          remote-host: localhost
          remote-port: 22
          remote-user: testuser
          remote-password: testpass
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5
            -----END OPENSSH PRIVATE KEY-----
          ssh-options: "-o ConnectTimeout=5"
          local-path: .
          remote-path: /tmp/deploy
          sync: delta
          sync-delta-excludes: "*.log *.tmp"
          sync-delta-includes: "README.md"
          artifacts: "false"
      - name: Assert action ran (fails gracefully on no real server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real SFTP server available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
