name: Test SFTP with SSH private key, ssh-options and ftp-options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "1"
          remote-user: "testuser"
          ssh-private-key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dummy-key-content-for-testing
            -----END OPENSSH PRIVATE KEY-----
          ssh-options: "-o ConnectTimeout=5 -o UserKnownHostsFile=/dev/null"
          ftp-options: "set net:reconnect-interval-base 1"
          local-path: "."
          remote-path: "/tmp/remote"
          sync: "full"
      - name: Assert generated lftp config uses key and options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ] && [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ ! -f ~/.lftprc ]; then
            echo "FAIL: ~/.lftprc not created"
            exit 1
          fi
          cat ~/.lftprc
          if ! grep -q 'sftp:connect-program /usr/bin/ssh -a -x -i ~/ssh_private_key -o ConnectTimeout=5 -o UserKnownHostsFile=/dev/null' ~/.lftprc; then
            echo "FAIL: connect-program does not include private key and ssh-options"
            exit 1
          fi
          if ! grep -q 'set net:reconnect-interval-base 1' ~/.lftprc; then
            echo "FAIL: ftp-options not in ~/.lftprc"
            exit 1
          fi
          if ! grep -q 'open sftp://testuser@127.0.0.1:1' ~/.lftprc; then
            echo "FAIL: open line missing"
            exit 1
          fi
          echo "PASS"
