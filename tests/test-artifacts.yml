name: Test delta sync with artifacts enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create extra file to include
        run: |
          mkdir -p artifact-extra
          echo "artifact" > artifact-extra/file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "127.0.0.1"
          remote-port: "1"
          remote-user: "testuser"
          remote-password: "testpassword"
          local-path: "."
          remote-path: "/tmp/remote"
          sync: "delta"
          sync-delta-includes: "artifact-extra"
          artifacts: "true"
      - name: Assert transfer artifacts copied
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ] && [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ "$(git rev-list --count --all)" -le 1 ]; then
            echo "PASS: single-commit history, delta sync cannot run (skipping artifact checks)"
            exit 0
          fi
          if ! command -v rsync >/dev/null 2>&1; then
            echo "PASS: rsync not available in this image, artifacts copy cannot run"
            exit 0
          fi
          ls -laR ~/transfer_files || true
          if [ ! -f ~/transfer_files/artifact-extra/file.txt ]; then
            echo "FAIL: ~/transfer_files/artifact-extra/file.txt not found"
            exit 1
          fi
          echo "PASS"
