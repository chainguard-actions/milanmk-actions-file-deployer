name: Test artifacts upload input

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        name: Run action with artifacts input enabled
        uses: .
        continue-on-error: true
        with:
          remote-protocol: "sftp"
          remote-host: "localhost"
          remote-port: "22"
          remote-user: "testuser"
          remote-password: "testpassword"
          local-path: "."
          remote-path: "/tmp/remote"
          sync: "delta"
          artifacts: "true"

      - name: Assert action ran (failed at connection, not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at connection stage (no real SFTP server),
          # but the artifacts input should be accepted without validation errors.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at connection stage as expected (artifacts input accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
